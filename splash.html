<!DOCTYPE html>
<html>
<head>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to bottom right, #fef3c7, #fef9c3);
            color: #78350f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 45px 60px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(180, 83, 9, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 150px;
        }

        .logo {
            width: 120px;
            height: 90px;
            margin-bottom: 20px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(180, 83, 9, 0.15));
            animation: fadeIn 0.8s ease-out;
        }

        .company {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 25px;
            text-align: center;
            background: linear-gradient(to right, #d97706, #b45309);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 0.8s ease-out 0.2s both;
            letter-spacing: 0.5px;
        }

        .loading {
            font-size: 15px;
            color: #92400e;
            margin-top: 5px;
            letter-spacing: 0.5px;
            animation: fadeIn 0.8s ease-out 0.4s both;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(217, 119, 6, 0.15);
            border-top-color: #d97706;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <img 
            id="splash-logo"
            class="logo" 
            alt="Apple Gold"
            src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23523400'%3E%3Cpath d='M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.702'/%3E%3C/svg%3E"
        >
        <div class="company" id="splash-company">Apple Gold</div>
        <div class="loading">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const logo = document.getElementById('splash-logo');
            const company = document.getElementById('splash-company');
            try {
                if (window.electronAPI && typeof window.electronAPI.getCompanyDetails === 'function') {
                    const details = await window.electronAPI.getCompanyDetails();
                    if (details && details.name) {
                        company.textContent = details.name;
                        logo.alt = details.name;
                        if (details.logo) {
                            logo.src = details.logo;
                        }
                    }
                }
            } catch (error) {
                console.error('Failed to load company details:', error);
            }
        });
    </script>
</body>
</html>
